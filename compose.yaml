services:
  pipeline:
    image: credito-monitorado:local
    build:
      context: .
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - dados:/app/data
      - artefatos:/app/artifacts
    restart: "no"

volumes:
  dados:
  artefatos:
