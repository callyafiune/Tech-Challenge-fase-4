[project]
name = "confiabilidade-credito"
version = "0.1.0"
description = "Observabilidade, contratos de dados e governança para risco de crédito"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2,<3", "numpy>=1.26,<3", "scikit-learn>=1.6,<2",
    "pandera[pandas]>=0.24,<0.37", "evidently>=0.7,<0.8",
    "mlflow>=3,<4", "scipy>=1.14,<2", "pyyaml>=6,<7",
    "xlrd>=2,<3", "psutil>=6,<8", "joblib>=1.4,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credito_monitorado"]

[project.scripts]
credito = "credito_monitorado.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integracao: testes com bibliotecas e artefatos reais"]
